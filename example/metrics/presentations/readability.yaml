# Проверки читаемости; подключаются через metric_groups: [presentations/readability].
# phase задаёт порядок, weight — вес метрики по умолчанию (1).
# handler выбирает Python-код, text — инструкцию или название проверки.
id: readability
phase: universal
checks:
- kind: function
  metric: Читаемость
  user_phrase: false
  handler: pptx/rendered_photos/text_background_contrast
  text: |-
    text_background_contrast
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: читается ли ГЛАВНЫЙ текст слайда (заголовки, пункты списков, текст карточек) без приближения, при
    взгляде на слайд целиком? Второстепенные подписи и сноски не оценивай. FAILED, если главный текст заметно
    мельче обычного тела презентации и его трудно разобрать. В observations назови, какой именно текст мелкий.
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: основной текст слайда набран обычной читаемым шрифтом (гротеск или антиква, включая системные)?
    FAILED, если основной текст набран декоративным, рукописным или моноширинным шрифтом, замедляющим чтение.
    Display-шрифт в заголовках при читаемом теле — норма. Размер, контраст, наложения не оценивай.
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: есть ли на слайде «кракозябры» — квадраты-заглушки (□, tofu), вопросительные знаки вместо букв,
    пропавшие или неверно отрисованные глифы? FAILED при хотя бы одном таком символе. Буквальные
    последовательности «\n» (обратный слэш и буква n) — не кракозябры, не оценивай их. Орфографию, контраст,
    размер шрифта не оценивай.
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  text: |-
    Вопрос: есть ли слайд-«простыня» — сплошной абзац или серия абзацев длиннее ~6 строк подряд БЕЗ маркеров,
    колонок, карточек или иной структуры? Таблицы, карточки и маркированные списки — структурированная подача,
    их не оценивай. Титульный, финальный и слайды-манифесты не оценивай. FAILED при хотя бы одном таком слайде.
