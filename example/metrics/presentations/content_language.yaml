# Текстовые LLM-проверки содержания и языка презентации.
# Подключаются через metric_groups: [content_language]; weight по умолчанию 1.
id: content_language
phase: universal
checks:
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: ясность главной мысли — держит ли колода одну ясную, сфокусированную центральную тему на всём
    протяжении. Границы слайдов помечены маркерами «=== СЛАЙД N ===». ПРИЗНАКИ PASS: по тексту колоды понятно,
    о чём она и какой у неё главный тезис; все контентные слайды работают на него. ПРИЗНАКИ FAIL: тема
    расплывается или теряется — часть слайдов не связана с главной темой, из колоды нельзя сформулировать одну
    главную мысль. FAILED при признаках FAIL. При сомнении — PASS. НЕ оценивай: дизайн, орфографию, полноту
    относительно задания.
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: заголовки контентных слайдов — сообщают ли они, О ЧЁМ слайд, ещё до чтения содержания.
    Границы слайдов помечены маркерами «=== СЛАЙД N ===», строка-заголовок слайда помечена меткой
    «(заголовок)» (проставлена автоматически по крупнейшему размеру шрифта). Заголовок — ТОЛЬКО строка с этой меткой;
    если метки нет — считай заголовком самую главную по виду строку. Кикеры/надзаголовки — короткие служебные
    надписи над заголовком («Проблема», «Рынок», «Бизнес-модель», «Раздел 2») — НЕ заголовки, не оценивай их
    вовсе. ПРИЗНАКИ PASS: заголовок конкретно называет предмет слайда («Выбор агентного ядра», «NSM:
    артефакты через ГигаКота», «Что говорят цифры») ИЛИ формулирует вывод/утверждение («Гибрид снижает
    расходы на офис на 30%», «AI-ассистент отвечает за секунды 24/7») — по заголовкам восстанавливается, о
    чём каждый слайд и какова логика колоды. ПРИЗНАКИ FAIL: большинство заголовков — пустые ярлыки без
    предмета: односложные общие темы («Проблема», «Преимущества», «План», «Итоги», «Анализ»), по которым
    непонятно, о чём слайд. Многословный заголовок, называющий конкретный предмет (в том числе отраслевой
    термин: «Конкурентный анализ», «Модель монетизации», «Дорожная карта»), — НЕ ярлык и НЕ дефект, даже
    если это не утверждение. Смешанная система (часть заголовков — выводы, часть — конкретные темы) —
    норма. FAILED при признаках FAIL. При сомнении — PASS. НЕ оценивай: орфографию, единообразие
    регистра, дизайн.
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: соответствие заголовков содержимому своих слайдов и отсутствие посторонней информации.
    Границы слайдов помечены маркерами «=== СЛАЙД N ===», строка-заголовок слайда помечена меткой
    «(заголовок)» (проставлена автоматически по крупнейшему размеру шрифта); если метки нет — считай заголовком самую
    главную по виду строку. ПРИЗНАКИ PASS: заголовок каждого контентного слайда точно отражает то, что на нём
    показано; на слайдах нет блоков, не относящихся к их теме. ПРИЗНАКИ FAIL: заголовок обещает одно, а слайд
    показывает другое (вводящий в заблуждение заголовок); на слайде присутствует блок, не относящийся к его
    теме. FAILED, если расхождение есть хотя бы на одном слайде. При сомнении — PASS. НЕ оценивай: формулировку
    заголовков как выводов, дизайн, орфографию.
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: нарративную дугу колоды — логику последовательности слайдов. Границы слайдов помечены
    маркерами «=== СЛАЙД N ===». ПРИЗНАКИ PASS: слайды рассказывают историю с развитием — контекст/проблема →
    решение/ответ → доказательства/детали → план/следующие шаги → итог; перестановка слайдов сломала бы
    повествование. ПРИЗНАКИ FAIL: слайды — случайный набор тем без развития, их можно перемешать без потери
    смысла; смысловые скачки без мостиков. FAILED при признаках FAIL. Короткие колоды (≤5 слайдов) оценивай
    мягко: дуги «проблема → решение → итог» достаточно для PASS. При сомнении — PASS. НЕ оценивай: дизайн,
    орфографию, полноту по заданию.
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: плотность пользы — несёт ли каждый контентный слайд конкретную информацию. Границы слайдов
    помечены маркерами «=== СЛАЙД N ===». ПРИЗНАКИ PASS: на контентных слайдах есть проверяемое содержание —
    цифры, факты, конкретные шаги, правила, сравнения, выводы; зритель уносит знания. ПРИЗНАКИ FAIL: два и более
    контентных слайда — «вода»: общие слова, очевидные трюизмы и декларации без единой конкретики («важно быть
    эффективным», «мы стремимся к лучшему»). Слайд с конкретным содержанием НЕ «вода», даже если в нём нет цифр:
    список правил, перечень шагов, распределение ролей, контакты — конкретная информация. Титульный и финальный
    слайды не оценивай. FAILED при признаках FAIL. При сомнении — PASS. НЕ оценивай: достоверность цифр, дизайн,
    орфографию.
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: лаконичность формулировок — минимум лишних слов при сохранении смысла. Границы слайдов
    помечены маркерами «=== СЛАЙД N ===». ПРИЗНАКИ PASS: фразы слайдов короткие и плотные по смыслу; нет
    тавтологий и повторов одной мысли разными словами внутри слайда. ПРИЗНАКИ FAIL: одна и та же МЫСЛЬ повторена
    на слайде дважды блоками ОДНОГО уровня (два пункта или две фразы говорят одно и то же; заголовок карточки
    дублируется её описанием); многословные канцелярские обороты без смысловой нагрузки («в рамках реализации
    мероприятий по...»). Заголовок-вывод (action title), формулирующий ключевую мысль или цифру слайда, — приём,
    а НЕ тавтология. Пара «кикер/надзаголовок + заголовок слайда» и «крупная цифра + её расшифровка» — приём
    акцентирования, а НЕ тавтология. Повтор отдельных служебных слов (один глагол в двух соседних пунктах) —
    НЕ тавтология и НЕ дефект. Удвоенные слова («Theoretically Theoretically») здесь НЕ оценивай. FAILED, если
    дефекты есть на двух и более слайдах. При сомнении — PASS. НЕ оценивай: телеграфность как стиль (короткие
    рубленые фразы — норма), орфографию, дизайн.
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие неслайдового содержания. Границы слайдов помечены маркерами «=== СЛАЙД N ===». На
    слайдах не должно быть: текста выступления или дикторских реплик («давайте рассмотрим...»), пояснений к
    дизайну («слайд выполнен в синих тонах»), служебных инструкций и промптов, мета-комментариев генерации («вот
    презентация», «слайд 3 из 10», «на этом слайде я размещу...»). ПРИЗНАКИ FAIL: любой такой фрагмент присутствует
    в тексте слайдов. FAILED при наличии хотя бы одного. При сомнении — PASS. НЕ оценивай: качество содержания,
    дизайн, орфографию.
