# Проверки стиля; подключаются через metric_groups: [style].
# weight задаёт вес метрики (по умолчанию 1); handler — путь к проверке.
id: style
phase: universal
checks:
- kind: function
  metric: Стиль
  user_phrase: false
  handler: pptx/raw_structure/style_consistency
  text: |-
    style_consistency
- kind: function
  metric: Стиль
  user_phrase: false
  handler: pptx/raw_structure/font_variety
  text: |-
    font_variety
- kind: llm
  input: rendered_photos
  metric: Стиль
  user_phrase: false
  text: |-
    Вопрос: БАЗОВАЯ палитра КОНТЕНТНЫХ слайдов (фон, основной цвет текста, основные заливки карточек/блоков)
    согласована между слайдами? Акцентные цвета не оценивай. Титульный и финальный слайды не сравнивай
    вовсе — светлые они или тёмные, их фон не относится к базовой палитре контентных слайдов. FAILED, если
    базовый фон или основные заливки контентных слайдов скачет между ними без системы (2+ слайдов). Шрифты,
    наложения, отступы не оценивай.
- kind: llm
  input: rendered_photos
  metric: Стиль
  user_phrase: false
  text: |-
    Вопрос: однотипные элементы (карточки, маркеры списков, рамки и обводки, иконки, шапки, подсветка ключевых
    слов) оформлены одинаково по всей колоде? Шрифты и их размеры не оценивай. Цветовое кодирование СЕКЦИЙ и
    КАТЕГОРИЙ (заголовки карточек окрашены по секциям, семантические цвета) — система, а не разнобой. FAILED,
    если часть элементов одного типа оформлена по-разному без системы (2+ слайдов): часть карточек с рамкой,
    часть без; маркеры разного вида; шапки разной формы; подсветка однотипных слов разного цвета. Наложения,
    контраст, отступы не оценивай.
- kind: llm
  input: text
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: единообразие текстового стиля колоды. ВАЖНО — AGENT_OUTPUT извлечён из XML автоматически:
    порядок фраз перемешан, слова могут быть разорваны пробелами посередине — это артефакты извлечения, не
    дефекты. Строка-заголовок слайда помечена меткой «(заголовок)» (проставлена автоматически по крупнейшему
    размеру шрифта); если метки нет — распознавай заголовок по виду строки. ПРИЗНАКИ PASS: однотипные элементы написаны
    в одном стиле — заголовки и пункты списков везде либо телеграфные фразы, либо полные предложения; один и
    тот же объект называется одинаково на всех слайдах; регистр и обращение едины. ПРИЗНАКИ FAIL: системный
    разнобой — часть заголовков с точкой, часть без; половина пунктов списков телеграфные, половина полными
    предложениями; смешение «ты»/«вы»; один термин в двух написаниях. Формулировки заголовков (вопрос /
    утверждение / назывная тема) сами по себе — НЕ разнобой. Единичные расхождения и различие стиля между
    заголовком и телом слайда — норма. Написание «е» вместо «ё» — не дефект. Если неочевидно, что строка —
    заголовок или пункт списка, не используй её как доказательство разнобоя. FAILED, если системный разнобой
    встречается на двух и более слайдах. При сомнении — PASS. НЕ оценивай: орфографию и пунктуацию, дизайн,
    содержание.
