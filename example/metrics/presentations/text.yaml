# Форматонезависимые проверки Artifact.text.
# Подключаются через metric_groups: [presentations/text]; weight по умолчанию равен 1.
id: text
phase: universal
checks:
- kind: function
  metric: Текст
  user_phrase: false
  handler: text/repeated_words
  text: |-
    repeated_words
- kind: function
  metric: Текст
  user_phrase: false
  handler: text/escaped_newlines
  text: |-
    escaped_newlines
- kind: function
  metric: Текст
  user_phrase: false
  handler: text/spelling
  text: |-
    spelling
