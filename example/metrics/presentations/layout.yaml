# Проверки компоновки; подключаются через metric_groups: [layout].
# weight задаёт вес метрики (по умолчанию 1).
# Сегменты handler raw_structure/rendered_photos выбирают атрибуты Artifact.
id: layout
phase: universal
checks:
- kind: function
  metric: Компоновка
  user_phrase: false
  handler: pptx/rendered_photos/slide_fullness
  text: |-
    slide_fullness
- kind: function
  metric: Компоновка
  user_phrase: false
  handler: pptx/raw_structure/empty_text_frame
  text: |-
    empty_text_frame
- kind: llm
  input: rendered_photos
  metric: Компоновка
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: накрыт ли ТЕКСТ другого элемента так, что часть букв не видна? Перед FAIL процитируй в observations
    конкретное слово, которое невозможно прочитать из-за накрытых букв, и назови, чем оно накрыто; если все
    слова читаются целиком — наложения нет. СОГЛАСОВАННОСТЬ ВЕРДИКТА: если в observations написано, что все
    слова читаются, вердикт обязан быть PASS. НЕ наложение: текст на подложке своей карточки; плашка или подпись
    поверх фото, мокапа или скриншота — весь текст ВНУТРИ скриншота, мокапа или фото (окна приложений, надписи
    на изображённых экранах) это содержимое картинки, а не вёрстка слайда, и плашка поверх него не overlap;
    декор (звёзды, 3D, стикеры) на пустых зонах, границах и углах, не закрывающий буквы. FAILED при первом
    случае. Обрезку краем кадра не оценивай (это clipping).
- kind: llm
  input: rendered_photos
  metric: Компоновка
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: отрезана ли часть букв или изображения краем кадра слайда или границей контейнера так, что слово
    невозможно прочитать? Перед FAIL процитируй в observations конкретное слово, которое невозможно прочитать
    из-за отсутствующей части букв; если все слова читаются — обрезки нет. «Близко к краю» при полностью
    видимых буквах — НЕ обрезка. FAILED при первом случае. Перенос слова на следующую строку и тесную, но
    полную вёрстку не оценивай.
- kind: llm
  input: rendered_photos
  metric: Компоновка
  user_phrase: false
  text: |-
    Вопрос: контент КОНТЕНТНЫХ слайдов выровнен по общей оси, а промежутки между одинаковыми элементами одного
    ряда (карточки в ряду, пункты списка) ровные? Титульный, финальный и слайды-манифесты не оценивай. FAILED,
    если смысловая группа заметно съехала с общей оси слайда без причины ИЛИ соседние промежутки одного ряда
    различаются визуально в ~2 раза и ряд выглядит рваным. В observations назови конкретный ряд или сдвиг; не
    можешь назвать — дефекта нет. Таблицы (ширина колонок по содержимому), намеренную группировку и цвета не
    оценивай.
- kind: llm
  input: rendered_photos
  metric: Компоновка
  user_phrase: false
  text: |-
    Вопрос: у каждого слайда есть заголовок — строка, визуально выделенная как главная (размером, жирностью или
    положением) и формулирующая тему? На титульном слайде и манифестах заголовком считается главная фраза.
    FAILED, если хотя бы на одном слайде такой строки нет. СОГЛАСОВАННОСТЬ ВЕРДИКТА: если в observations ты
    написал, что заголовки есть на всех слайдах, вердикт обязан быть PASS. Стиль, размер, цвет и текст заголовка
    не оценивай.
