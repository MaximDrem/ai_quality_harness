id: template_cleanup_ai
phase: universal
checks:
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_slide_text
    artifacts: [presentation]
    options:
      terms:
        - CREDITS
        - Here is where your presentation begins
        - Mercury is the closest planet
        - Venus is the second planet
        - Follow the link in the graph
        - Instructions for use
        - Create your Story
        - Educational Icons
        - Business Icons
        - Help & Support Icons
        - Nature Icons
        - SEO & Marketing Icons
      patterns:
        - '(?i)for more info.*click here'
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_metadata
    artifacts: [presentation]
    options:
      terms: [Slidesgo, CREDITS]
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_links
    artifacts: [presentation]
    options:
      terms: [slidesgo.com]
      patterns:
        - '(?i)https?://[^\s"]*slidesgo(?:\.com)?'
