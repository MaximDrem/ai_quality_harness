# Общая группа читаемости XLSX; не подключается автоматически по типу файла.
# weight по умолчанию равен 1; phase задаёт порядок в чек-листе.
id: readability
phase: universal
checks:
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: читаемость текста в ячейках (не обрезается ли содержимое). ИГНОРИРУЙ: форматирование чисел,
    цвета. Вопрос: весь текст в ячейках полностью виден?
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: ширину столбцов относительно содержимого. ИГНОРИРУЙ: цвета, шрифты. Вопрос: столбцы
    достаточно широки, нет ли обрезанных значений?
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: форматирование чисел (разделители разрядов, проценты, валюты). ИГНОРИРУЙ: формулы, цвета.
    Вопрос: числа отображаются в читаемом формате?
- kind: llm
  input: rendered_photos
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: контраст текста и фона ячеек. ИГНОРИРУЙ: шрифты, формулы. Вопрос: текст контрастен фону
    ячеек?
