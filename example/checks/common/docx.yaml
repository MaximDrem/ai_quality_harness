# Общие проверки для артефактов типа .docx.
# checks — добавляются в чек-лист каждого кейса этого типа (итог = checks
# отсюда + checks из data/<case_id>.yaml).
# universal — дефолтный чек-лист для `--validate` без `--case` и добавка при
# полном прогоне (дедупликация по строке).
# Формат проверки: kind/metric/user_phrase/text (см. data/GD-001.yaml).
artifact_type: .docx
checks:
- kind: functional
  metric: Функциональные
  user_phrase: false
  text: |-
    file_exists
- kind: functional
  metric: Функциональные
  user_phrase: false
  text: |-
    render_success
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: визуальный размер основного шрифта документа. ИГНОРИРУЙ: цвета, выравнивание, поля. Вопрос:
    шрифт достаточно крупный (визуально ≥11pt) и не вызывает напряжения при чтении?
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: контраст текста и фона. ИГНОРИРУЙ: шрифт, отступы, переносы. Вопрос: текст достаточно
    контрастен фону для комфортного чтения?
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: межстрочный интервал и отступы между абзацами. ИГНОРИРУЙ: шрифт, цвета, поля. Вопрос: строки
    и абзацы визуально отделены друг от друга?
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: шрифт основного текста. ИГНОРИРУЙ: размер, контраст. Вопрос: шрифт легко читаем, без
    излишней декоративности?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: выход контента за границы страницы (обрезание краями). ИГНОРИРУЙ: переносы между страницами,
    шрифт. Вопрос: текст не обрезается краями страницы?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наличие висячих строк (одиноких строк абзаца в начале/конце страницы). ИГНОРИРУЙ: шрифт,
    цвета. Вопрос: нет ли визуально неаккуратных переносов абзацев?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: выравнивание основного текста и заголовков. ИГНОРИРУЙ: шрифт, цвета. Вопрос: выравнивание
    единообразно по всему документу?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: поля страницы и отступы абзацев. ИГНОРИРУЙ: шрифт, цвета. Вопрос: поля и отступы равномерны и
    достаточны?
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: единообразие шрифтов и начертаний по всему документу. ИГНОРИРУЙ: отступы, цвета. Вопрос:
    документ выдержан в едином стиле?
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: визуальную иерархию заголовков и подзаголовков. ИГНОРИРУЙ: шрифт основного текста. Вопрос:
    заголовки визуально выделены (размер/жирность)?
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: единообразие нумерации и маркеров списков. ИГНОРИРУЙ: шрифт, цвета. Вопрос: списки оформлены
    в едином стиле?
