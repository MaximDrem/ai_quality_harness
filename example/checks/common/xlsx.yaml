# Общие проверки для артефактов типа .xlsx.
# checks — добавляются в чек-лист каждого кейса этого типа (итог = checks
# отсюда + checks из data/<case_id>.yaml).
# universal — дефолтный чек-лист для `--validate` без `--case` и добавка при
# полном прогоне (дедупликация по строке).
# Формат проверки: kind/metric/user_phrase/text (см. data/GD-001.yaml).
artifact_type: .xlsx
checks:
- kind: functional
  metric: Функциональные
  user_phrase: false
  text: |-
    file_exists
- kind: functional
  metric: Функциональные
  user_phrase: false
  text: |-
    render_success
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: читаемость текста в ячейках (не обрезается ли содержимое). ИГНОРИРУЙ: форматирование чисел,
    цвета. Вопрос: весь текст в ячейках полностью виден?
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: ширину столбцов относительно содержимого. ИГНОРИРУЙ: цвета, шрифты. Вопрос: столбцы
    достаточно широки, нет ли обрезанных значений?
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: форматирование чисел (разделители разрядов, проценты, валюты). ИГНОРИРУЙ: формулы, цвета.
    Вопрос: числа отображаются в читаемом формате?
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: контраст текста и фона ячеек. ИГНОРИРУЙ: шрифты, формулы. Вопрос: текст контрастен фону
    ячеек?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: выравнивание данных в ячейках (числа — по правому краю, текст — по левому, заголовки —
    центрированы). ИГНОРИРУЙ: цвета, шрифты. Вопрос: выравнивание единообразно и логично?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие лишних пустых строк/столбцов, разрывающих данные. ИГНОРИРУЙ: форматирование.
    Вопрос: данные идут без неоправданных разрывов?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие наложений и слипания ячеек при рендере. ИГНОРИРУЙ: формулы. Вопрос: таблица
    рендерится ровно, строки и столбцы не смещены?
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: визуальное выделение заголовков столбцов (жирный, фон, граница). ИГНОРИРУЙ: данные, цвета
    данных. Вопрос: заголовки визуально отделены от данных?
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: визуальное выделение итоговых строк/столбцов (если они есть). ИГНОРИРУЙ: формулы. Вопрос:
    итоги визуально выделены?
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: единообразие форматирования по всей таблице. ИГНОРИРУЙ: значения данных. Вопрос: стили ячеек
    применены последовательно?
universal:
