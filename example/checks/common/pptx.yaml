# Общие проверки для артефактов типа .pptx.
# checks — добавляются в чек-лист каждого кейса этого типа (итог = checks
# отсюда + checks из data/<case_id>.yaml); здесь только sanity-проверки.
# universal — дефолтный чек-лист для `--validate` без `--case` и добавка при
# полном прогоне (дедупликация по строке); здесь все проверки качества.
# Формат проверки: kind/metric/user_phrase/text (см. data/GD-001.yaml).
#
# Метрики:
#   Читаемость     — можно ли считать слайды с экрана;
#   Компоновка     — геометрия вёрстки;
#   Стиль          — единообразие оформления;
#   Красота        — эстетика дизайн-решений;
#   Текст          — технические дефекты текста;
#   Контент и язык — смысл и язык контента.
artifact_type: .pptx
checks:
- kind: functional
  metric: Функциональные
  user_phrase: false
  text: |-
    file_exists
- kind: functional
  metric: Функциональные
  user_phrase: false
  text: |-
    render_success
universal:
# ---------------------------------------------------------------------------
# Читаемость — можно ли считать слайды с экрана.
# ---------------------------------------------------------------------------
- kind: functional
  metric: Читаемость
  user_phrase: false
  text: |-
    text_background_contrast
- kind: vlm
  metric: Читаемость
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: читается ли ГЛАВНЫЙ текст слайда (заголовки, пункты списков, текст карточек) без приближения, при
    взгляде на слайд целиком? Второстепенные подписи и сноски не оценивай. FAILED, если главный текст заметно
    мельче обычного тела презентации и его трудно разобрать. В observations назови, какой именно текст мелкий.
- kind: vlm
  metric: Читаемость
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: основной текст слайда набран обычной читаемым шрифтом (гротеск или антиква, включая системные)?
    FAILED, если основной текст набран декоративным, рукописным или моноширинным шрифтом, замедляющим чтение.
    Display-шрифт в заголовках при читаемом теле — норма. Размер, контраст, наложения не оценивай.
- kind: vlm
  metric: Читаемость
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: есть ли на слайде «кракозябры» — квадраты-заглушки (□, tofu), вопросительные знаки вместо букв,
    пропавшие или неверно отрисованные глифы? FAILED при хотя бы одном таком символе. Буквальные
    последовательности «\n» (обратный слэш и буква n) — не кракозябры, не оценивай их. Орфографию, контраст,
    размер шрифта не оценивай.
- kind: vlm
  metric: Читаемость
  user_phrase: false
  text: |-
    Вопрос: есть ли слайд-«простыня» — сплошной абзац или серия абзацев длиннее ~6 строк подряд БЕЗ маркеров,
    колонок, карточек или иной структуры? Таблицы, карточки и маркированные списки — структурированная подача,
    их не оценивай. Титульный, финальный и слайды-манифесты не оценивай. FAILED при хотя бы одном таком слайде.
# ---------------------------------------------------------------------------
# Компоновка — геометрия вёрстки.
# ---------------------------------------------------------------------------
- kind: functional
  metric: Компоновка
  user_phrase: false
  text: |-
    slide_fullness
- kind: functional
  metric: Компоновка
  user_phrase: false
  text: |-
    empty_text_frame
- kind: vlm
  metric: Компоновка
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: накрыт ли ТЕКСТ другого элемента так, что часть букв не видна? Перед FAIL процитируй в observations
    конкретное слово, которое невозможно прочитать из-за накрытых букв, и назови, чем оно накрыто; если все
    слова читаются целиком — наложения нет. СОГЛАСОВАННОСТЬ ВЕРДИКТА: если в observations написано, что все
    слова читаются, вердикт обязан быть PASS. НЕ наложение: текст на подложке своей карточки; плашка или подпись
    поверх фото, мокапа или скриншота — весь текст ВНУТРИ скриншота, мокапа или фото (окна приложений, надписи
    на изображённых экранах) это содержимое картинки, а не вёрстка слайда, и плашка поверх него не overlap;
    декор (звёзды, 3D, стикеры) на пустых зонах, границах и углах, не закрывающий буквы. FAILED при первом
    случае. Обрезку краем кадра не оценивай (это clipping).
- kind: vlm
  metric: Компоновка
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: отрезана ли часть букв или изображения краем кадра слайда или границей контейнера так, что слово
    невозможно прочитать? Перед FAIL процитируй в observations конкретное слово, которое невозможно прочитать
    из-за отсутствующей части букв; если все слова читаются — обрезки нет. «Близко к краю» при полностью
    видимых буквах — НЕ обрезка. FAILED при первом случае. Перенос слова на следующую строку и тесную, но
    полную вёрстку не оценивай.
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    Вопрос: контент КОНТЕНТНЫХ слайдов выровнен по общей оси, а промежутки между одинаковыми элементами одного
    ряда (карточки в ряду, пункты списка) ровные? Титульный, финальный и слайды-манифесты не оценивай. FAILED,
    если смысловая группа заметно съехала с общей оси слайда без причины ИЛИ соседние промежутки одного ряда
    различаются визуально в ~2 раза и ряд выглядит рваным. В observations назови конкретный ряд или сдвиг; не
    можешь назвать — дефекта нет. Таблицы (ширина колонок по содержимому), намеренную группировку и цвета не
    оценивай.
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    Вопрос: у каждого слайда есть заголовок — строка, визуально выделенная как главная (размером, жирностью или
    положением) и формулирующая тему? На титульном слайде и манифестах заголовком считается главная фраза.
    FAILED, если хотя бы на одном слайде такой строки нет. СОГЛАСОВАННОСТЬ ВЕРДИКТА: если в observations ты
    написал, что заголовки есть на всех слайдах, вердикт обязан быть PASS. Стиль, размер, цвет и текст заголовка
    не оценивай.
# ---------------------------------------------------------------------------
# Стиль — единообразие оформления по колоде.
# ---------------------------------------------------------------------------
- kind: functional
  metric: Стиль
  user_phrase: false
  text: |-
    style_consistency
- kind: functional
  metric: Стиль
  user_phrase: false
  text: |-
    font_variety
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    Вопрос: БАЗОВАЯ палитра КОНТЕНТНЫХ слайдов (фон, основной цвет текста, основные заливки карточек/блоков)
    согласована между слайдами? Акцентные цвета не оценивай. Титульный и финальный слайды не сравнивай
    вовсе — светлые они или тёмные, их фон не относится к базовой палитре контентных слайдов. FAILED, если
    базовый фон или основные заливки контентных слайдов скачет между ними без системы (2+ слайдов). Шрифты,
    наложения, отступы не оценивай.
- kind: vlm
  metric: Стиль
  user_phrase: false
  text: |-
    Вопрос: однотипные элементы (карточки, маркеры списков, рамки и обводки, иконки, шапки, подсветка ключевых
    слов) оформлены одинаково по всей колоде? Шрифты и их размеры не оценивай. Цветовое кодирование СЕКЦИЙ и
    КАТЕГОРИЙ (заголовки карточек окрашены по секциям, семантические цвета) — система, а не разнобой. FAILED,
    если часть элементов одного типа оформлена по-разному без системы (2+ слайдов): часть карточек с рамкой,
    часть без; маркеры разного вида; шапки разной формы; подсветка однотипных слов разного цвета. Наложения,
    контраст, отступы не оценивай.
- kind: text
  metric: Стиль
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: единообразие текстового стиля колоды. ВАЖНО — AGENT_OUTPUT извлечён из XML автоматически:
    порядок фраз перемешан, слова могут быть разорваны пробелами посередине — это артефакты извлечения, не
    дефекты. Строка-заголовок слайда помечена меткой «(заголовок)» (проставлена автоматически по крупнейшему
    размеру шрифта); если метки нет — распознавай заголовок по виду строки. ПРИЗНАКИ PASS: однотипные элементы написаны
    в одном стиле — заголовки и пункты списков везде либо телеграфные фразы, либо полные предложения; один и
    тот же объект называется одинаково на всех слайдах; регистр и обращение едины. ПРИЗНАКИ FAIL: системный
    разнобой — часть заголовков с точкой, часть без; половина пунктов списков телеграфные, половина полными
    предложениями; смешение «ты»/«вы»; один термин в двух написаниях. Формулировки заголовков (вопрос /
    утверждение / назывная тема) сами по себе — НЕ разнобой. Единичные расхождения и различие стиля между
    заголовком и телом слайда — норма. Написание «е» вместо «ё» — не дефект. Если неочевидно, что строка —
    заголовок или пункт списка, не используй её как доказательство разнобоя. FAILED, если системный разнобой
    встречается на двух и более слайдах. При сомнении — PASS. НЕ оценивай: орфографию и пунктуацию, дизайн,
    содержание.
# ---------------------------------------------------------------------------
# Красота — уровень визуальной проработки: количественная наполненность (код)
# и эстетика дизайн-решений (суждения «глазом»).
# ---------------------------------------------------------------------------
- kind: functional
  metric: Красота
  user_phrase: false
  text: |-
    image_coverage
- kind: functional
  metric: Красота
  user_phrase: false
  text: |-
    shape_density
- kind: functional
  metric: Красота
  user_phrase: false
  text: |-
    content_variety
- kind: functional
  metric: Красота
  user_phrase: false
  text: |-
    text_hierarchy
- kind: vlm
  metric: Красота
  user_phrase: false
  text: |-
    Вопрос: на каждом контентном слайде есть главное, выделенное акцентом (цвет, заливка, крупная цифра, рамка,
    подсвеченная карточка)? Приглушение второстепенного текста — инструмент акцента, не дефект. Ряд одинаковых
    карточек с цветными метками внутри — НЕ «ровная стена». FAILED, если на 2+ контентных слайдах нет ни
    одного акцента — глазу не за что зацепиться. Наложения, контраст, размер шрифта не оценивай.
- kind: vlm
  metric: Красота
  user_phrase: false
  text: |-
    Вопрос: есть хотя бы один фирменный приём ВНЕ стандартного шаблона, повторяющийся от слайда к слайду (своя
    тема или фон, шапка с логотипом, системный декор, нестандартные карточки или палитра)? СТАНДАРТНЫЙ НАБОР
    фирменностью НЕ считается: цветная плашка-шапка с заголовком, круглые иконки с цифрами, прямоугольные
    карточки, тёмный титульный слайд. FAILED, если все приёмы сводятся к стандартному набору или их нет —
    колоду нельзя узнать среди тысячи других. Наложения, контраст, содержание не оценивай.
- kind: vlm
  metric: Красота
  user_phrase: false
  text: |-
    Вопрос: есть ли системная образная графика — иллюстрации, 3D-объекты, авторская графика или осмысленные
    фотографии на нескольких слайдах, образующие единый ряд (персонаж, метафора, мир)? Интерфейсные иконки,
    диаграммы, таблицы и геометрические декорации — НЕ иллюстрации. FAILED, если визуальный ряд чисто
    функциональный или образная графика единична (1 слайд на колоду). Наложения и качество рендера не оценивай.
- kind: vlm
  metric: Красота
  user_phrase: false
  text: |-
    Вопрос: первый слайд выглядит спроектированным? Оценивай ТОЛЬКО слайд 1 — титульный; остальные
    изображения запроса не оценивай. Сначала назови в observations фактический фон титульного слайда
    (тёмный/светлый, цвет, градиент, изображение). FAILED, если титульный слайд — просто текст на пустом
    белом или дефолтном светлом фоне без графических элементов. Сплошная цветная или тёмная заливка фона,
    градиент, изображение, фирменная графика, заметные графические детали — уже выразительный фон, это
    PASS. Содержание названия и размер шрифта не оценивай.
- kind: vlm
  metric: Красота
  user_phrase: false
  text: |-
    Вопрос: последний слайд подводит итог или фиксирует дальнейшие действия — выводы, резюме ценности, план,
    следующие шаги, таблица открытых вопросов или проектов решений, призыв к действию, контакты, благодарность?
    FAILED, если колода обрывается на рядовом содержательном блоке без завершения. Оформление и размер шрифта не
    оценивай.
- kind: vlm
  metric: Красота
  user_phrase: false
  single_slide: true
  text: |-
    Вопрос: все изображения, схемы и графики на слайде резкие, без пикселизации, битых иконок и искажения
    пропорций (растянутые или сплющенные)? FAILED при хотя бы одном дефекте. Слайды без изображений не
    оценивай. Уместность графики и текст не оценивай.
- kind: vlm
  metric: Красота
  user_phrase: false
  text: |-
    Вопрос: изображения и иконки относятся к теме своих слайдов и помогают понять мысль, а не являются
    случайными «заглушками»? Фирменный маскот или персонаж бренда, повторяющийся по колоде, — осмысленный
    образ, не заглушка. Фоновые декорации (блики, фигуры, градиенты) не оценивай. FAILED, если
    графика-заглушка на 2+ слайдах. Техническое качество графики не оценивай.
# ---------------------------------------------------------------------------
# Текст — технические дефекты текста (считаются кодом).
# ---------------------------------------------------------------------------
- kind: functional
  metric: Текст
  user_phrase: false
  text: |-
    repeated_words
- kind: functional
  metric: Текст
  user_phrase: false
  text: |-
    escaped_newlines
- kind: functional
  metric: Текст
  user_phrase: false
  text: |-
    spelling
# ---------------------------------------------------------------------------
# Контент и язык — смысл и язык контента (что сказано и как сформулировано).
# ---------------------------------------------------------------------------
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: ясность главной мысли — держит ли колода одну ясную, сфокусированную центральную тему на всём
    протяжении. Границы слайдов помечены маркерами «=== СЛАЙД N ===». ПРИЗНАКИ PASS: по тексту колоды понятно,
    о чём она и какой у неё главный тезис; все контентные слайды работают на него. ПРИЗНАКИ FAIL: тема
    расплывается или теряется — часть слайдов не связана с главной темой, из колоды нельзя сформулировать одну
    главную мысль. FAILED при признаках FAIL. При сомнении — PASS. НЕ оценивай: дизайн, орфографию, полноту
    относительно задания.
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: заголовки контентных слайдов — сообщают ли они, О ЧЁМ слайд, ещё до чтения содержания.
    Границы слайдов помечены маркерами «=== СЛАЙД N ===», строка-заголовок слайда помечена меткой
    «(заголовок)» (проставлена автоматически по крупнейшему размеру шрифта). Заголовок — ТОЛЬКО строка с этой меткой;
    если метки нет — считай заголовком самую главную по виду строку. Кикеры/надзаголовки — короткие служебные
    надписи над заголовком («Проблема», «Рынок», «Бизнес-модель», «Раздел 2») — НЕ заголовки, не оценивай их
    вовсе. ПРИЗНАКИ PASS: заголовок конкретно называет предмет слайда («Выбор агентного ядра», «NSM:
    артефакты через ГигаКота», «Что говорят цифры») ИЛИ формулирует вывод/утверждение («Гибрид снижает
    расходы на офис на 30%», «AI-ассистент отвечает за секунды 24/7») — по заголовкам восстанавливается, о
    чём каждый слайд и какова логика колоды. ПРИЗНАКИ FAIL: большинство заголовков — пустые ярлыки без
    предмета: односложные общие темы («Проблема», «Преимущества», «План», «Итоги», «Анализ»), по которым
    непонятно, о чём слайд. Многословный заголовок, называющий конкретный предмет (в том числе отраслевой
    термин: «Конкурентный анализ», «Модель монетизации», «Дорожная карта»), — НЕ ярлык и НЕ дефект, даже
    если это не утверждение. Смешанная система (часть заголовков — выводы, часть — конкретные темы) —
    норма. FAILED при признаках FAIL. При сомнении — PASS. НЕ оценивай: орфографию, единообразие
    регистра, дизайн.
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: соответствие заголовков содержимому своих слайдов и отсутствие посторонней информации.
    Границы слайдов помечены маркерами «=== СЛАЙД N ===», строка-заголовок слайда помечена меткой
    «(заголовок)» (проставлена автоматически по крупнейшему размеру шрифта); если метки нет — считай заголовком самую
    главную по виду строку. ПРИЗНАКИ PASS: заголовок каждого контентного слайда точно отражает то, что на нём
    показано; на слайдах нет блоков, не относящихся к их теме. ПРИЗНАКИ FAIL: заголовок обещает одно, а слайд
    показывает другое (вводящий в заблуждение заголовок); на слайде присутствует блок, не относящийся к его
