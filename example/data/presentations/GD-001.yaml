# Тест-кейс GD-001.
# checks — только индивидуальные проверки кейса. Формат проверки:
#   kind: text | vlm | functional (по умолчанию text)
#   metric: имя метрики (необязательно)
#   user_phrase: true/false — передавать ли user_phrase кейса судье (по умолчанию true)
#   text: многострочный текст проверки (строки склеиваются через пробел)
# Общие проверки подключаются из checks/metrics/presentations/<группа>.yaml.
id: GD-001
user_phrase: |-
  Сделай презентацию на 7 слайдов про преимущества перехода на гибридный формат работы. Мы компания
  из 300 человек, для нас это новая тема. Структура нужна такая: титульный слайд, проблема,
  преимущества, риски, рекомендации, план внедрения и заключение. Точных цифр по эффекту у нас нет —
  если приводишь цифры, помечай их как оценочные.
skill: presentation
artifact_type: .pptx
processor: pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: functional
  metric: Следование инструкции
  user_phrase: false
  handler: pptx/instruction/slide_count
  options:
    condition: 7
  text: |-
    slide_count 7
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наличие всех 7 смысловых блоков (титульный, проблема, преимущества, риски, рекомендации, план
    внедрения, заключение). ИГНОРИРУЙ: оформление, цифры. Вопрос: все 7 разделов присутствуют?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие выдуманных точных цифр без пометки «оценочно»/«примерно». ИГНОРИРУЙ: оформление.
    Вопрос: все количественные данные либо помечены как оценка, либо отсутствуют?
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: деловой стиль текста. ИГНОРИРУЙ: вёрстку, цифры. Вопрос: отсутствует ли разговорная лексика,
    выдержан ли деловой тон?
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: количество буллетов на слайд. ИГНОРИРУЙ: содержание буллетов. Вопрос: на каждом слайде ≤7
    буллетов (включая заголовок как элемент)?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: упоминание контекста компании на 300 человек. ИГНОРИРУЙ: оформление. Вопрос: контент
    адаптирован под масштаб компании?