# Тест-кейс GD-022.
# metric_groups — группы из metrics/presentations/<группа>.yaml.
# checks — индивидуальные проверки кейса:
#   kind: llm | function (по умолчанию llm)
#   metric: имя метрики; weight: её вес (по умолчанию 1)
#   handler: Python-проверка относительно checks/functional/
#   input (обязателен для llm): text | raw_structure | rendered_photos | tool_call
#   options: параметры handler; user_phrase: передавать ли запрос судье
#   text: многострочный текст проверки (строки склеиваются через пробел)
id: GD-022
user_phrase: |-
  Сделай презентацию для онбординга нового менеджера по продажам — план его первых 30 дней.
  По неделям так: неделя 1 — знакомство с компанией, неделя 2 — обучение, неделя 3 — работа
  с наставником, неделя 4 — самостоятельная работа. Тон дружелюбный: человек приходит к нам впервые.
skill: presentation
artifact_type: .pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: упоминание должности (менеджер по продажам). ИГНОРИРУЙ: оформление. Вопрос: должность указана
    явно?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: план по неделям (неделя 1 — знакомство, неделя 2 — обучение, неделя 3 — работа с наставником,
    неделя 4 — самостоятельная работа). ИГНОРИРУЙ: оформление. Вопрос: все 4 этапа указаны точно?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: соответствие таймлайна 30 дням. ИГНОРИРУЙ: оформление. Вопрос: этапы укладываются в 30 дней?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наличие разбивки по неделям. ИГНОРИРУЙ: оформление. Вопрос: разбивка по неделям присутствует?
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: дружелюбный тон для онбординга. ИГНОРИРУЙ: оформление. Вопрос: тон соответствует вводному
    материалу для новичка?