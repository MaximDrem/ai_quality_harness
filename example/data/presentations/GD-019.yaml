# Тест-кейс GD-019.
# checks — только индивидуальные проверки кейса. Формат проверки:
#   kind: text | vlm | functional (по умолчанию text)
#   metric: имя метрики (необязательно)
#   user_phrase: true/false — передавать ли user_phrase кейса судье (по умолчанию true)
#   text: многострочный текст проверки (строки склеиваются через пробел)
# Общие проверки подключаются из checks/metrics/presentations/<группа>.yaml.
id: GD-019
user_phrase: |-
  Нужна презентация стратегии на 3 года для совета директоров, фокус — рост выручки,
  маржинальность и новые продукты. Исходные данные: сейчас выручка 100 млн ₽, маржинальность 25%.
  Цели: выручка 180 млн ₽, маржинальность 30%, 2 новых SaaS-продукта. Других целей не добавляй,
  цифры только эти.
skill: presentation
artifact_type: .pptx
processor: pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: горизонт планирования (3 года). ИГНОРИРУЙ: оформление. Вопрос: горизонт указан как 3 года?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: целевые показатели (выручка 180 млн ₽, маржинальность 30%, 2 новых SaaS-продукта). ИГНОРИРУЙ:
    оформление. Вопрос: все 3 цели указаны точно?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: текущие показатели (выручка 100 млн ₽, маржинальность 25%). ИГНОРИРУЙ: оформление. Вопрос:
    текущие показатели указаны точно?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: корректность расчёта роста (выручка +80%, маржа +5 п.п.). ИГНОРИРУЙ: оформление. Вопрос:
    производные цифры корректны?
- kind: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие лишних целей, не указанных во входных данных. ИГНОРИРУЙ: оформление. Вопрос:
    только указанные 3 цели присутствуют?
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: деловой стиль для совета директоров. ИГНОРИРУЙ: оформление. Вопрос: тон соответствует уровню
    аудитории?