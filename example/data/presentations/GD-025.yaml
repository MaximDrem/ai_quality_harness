# Тест-кейс GD-025.
# metric_groups — группы из metrics/presentations/<группа>.yaml.
# checks — индивидуальные проверки кейса:
#   kind: llm | function (по умолчанию llm)
#   metric: имя метрики; weight: её вес (по умолчанию 1)
#   handler: Python-проверка относительно checks/functional/
#   input (обязателен для llm): text | raw_structure | rendered_photos | tool_call
#   options: параметры handler; user_phrase: передавать ли запрос судье
#   text: многострочный текст проверки (строки склеиваются через пробел)
id: GD-025
user_phrase: |-
  Сделай презентацию с результатами исследования удовлетворённости клиентов (CSAT и NPS). Данные:
  CSAT 4,2 из 5, причём 84% клиентов поставили оценки 4 и 5. NPS — 35: промоутеров 40%, критиков 5%.
  Это считается хорошим результатом — так и подай. В конце добавь выводы и рекомендации, что делать
  дальше.
skill: presentation
artifact_type: .pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: значение CSAT = 4,2 из 5. ИГНОРИРУЙ: оформление. Вопрос: CSAT указан точно?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: долю удовлетворённых клиентов (84%, оценки 4 и 5). ИГНОРИРУЙ: оформление. Вопрос: 84% указаны
    точно?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: значение NPS = 35 (40% промоутеров, 5% критиков). ИГНОРИРУЙ: оформление. Вопрос: все три
    цифры указаны точно?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: интерпретацию NPS 35 как «хороший» результат. ИГНОРИРУЙ: оформление. Вопрос: интерпретация
    присутствует?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наличие выводов и рекомендаций по итогам исследования. ИГНОРИРУЙ: оформление. Вопрос: выводы
    и рекомендации присутствуют?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: использование только предоставленных данных. ИГНОРИРУЙ: оформление. Вопрос: нет ли выдуманных
    цифр?