# Тест-кейс GD-013.
# checks — только индивидуальные проверки кейса. Формат проверки:
#   kind: text | vlm | functional (по умолчанию text)
#   metric: имя метрики (необязательно)
#   user_phrase: true/false — передавать ли user_phrase кейса судье (по умолчанию true)
#   text: многострочный текст проверки (строки склеиваются через пробел)
# Общие проверки подключаются из checks/metrics/presentations/<группа>.yaml.
id: GD-013
user_phrase: |-
  Сделай презентацию для сотрудников про новые правила удалённой работы, вступают в силу
  с 1 сентября 2026 года. Схема такая: до 3 дней удалённо — понедельник, вторник и пятница; в офисе
  работаем в среду и четверг, причём среда обязательна для всех, а четверг — второй офисный день.
  На удалёнку нужно подавать заявку минимум за 24 часа. Тон дружелюбный, но информативный.
skill: presentation
artifact_type: .pptx
processor: pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: дату введения (1 сентября 2026 года, с явным указанием года). ИГНОРИРУЙ: оформление. Вопрос:
    дата указана точно и с годом?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: схему удалённых/офисных дней (3 дня удалённо — пн, вт, пт; 2 дня в офисе — ср, чт).
    ИГНОРИРУЙ: оформление. Вопрос: схема указана точно?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: указание обязательного офисного дня — среда. ИГНОРИРУЙ: оформление. Вопрос: среда выделена
    как обязательная?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: указание второго офисного дня — четверг. ИГНОРИРУЙ: оформление. Вопрос: четверг указан как
    второй офисный?
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: требование подачи заявки на удалёнку за 24 часа. ИГНОРИРУЙ: оформление. Вопрос: требование 24
    часов указано?
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: тон для внутренней коммуникации. ИГНОРИРУЙ: оформление. Вопрос: тон дружелюбный, но
    информативный?