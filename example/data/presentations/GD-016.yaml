# Тест-кейс GD-016.
# metric_groups — группы из metrics/presentations/<группа>.yaml.
# checks — индивидуальные проверки кейса:
#   kind: llm | function (по умолчанию llm)
#   metric: имя метрики; weight: её вес (по умолчанию 1)
#   handler: Python-проверка относительно checks/functional/
#   input (обязателен для llm): text | raw_structure | rendered_photos | tool_call
#   options: параметры handler; user_phrase: передавать ли запрос судье
#   text: многострочный текст проверки (строки склеиваются через пробел)
id: GD-016
user_phrase: |-
  Сделай презентацию «Почему мы» для тендера, максимум 8 слайдов. Обязательно раскрой блоки: наш
  опыт, команда, подход к работе, кейсы. Факты только такие: на рынке 10 лет, 50 клиентов, в команде
  30 человек. Сверх них ничего не выдумывай и обойдись без громких заявлений вроде «лидеры рынка».
skill: presentation
artifact_type: .pptx
metric_groups:
  - presentations/sanity
  - presentations/readability
  - presentations/layout
  - presentations/style
  - presentations/beauty
  - presentations/text
  - presentations/content_language
checks:
- kind: function
  metric: Следование инструкции
  user_phrase: false
  handler: pptx/raw_structure/slide_count
  options:
    condition: <=8
  text: |-
    slide_count <=8
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наличие блоков (опыт, команда, подход, кейсы). ИГНОРИРУЙ: оформление. Вопрос: все 4 блока
    присутствуют?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: использование только предоставленных фактов (опыт 10 лет, 50 клиентов, команда 30 человек).
    ИГНОРИРУЙ: оформление. Вопрос: используются только эти факты?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие неподтверждённых громких заявлений («лидеры рынка», «лучшие в отрасли»).
    ИГНОРИРУЙ: оформление. Вопрос: громкие заявления отсутствуют?
- kind: llm
  input: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: логику повествования. ИГНОРИРУЙ: оформление. Вопрос: логика «почему именно мы» прослеживается
    через все слайды?
