# Тест-кейс GD-007.
# metric_groups — группы из metrics/presentations/<группа>.yaml.
# checks — индивидуальные проверки кейса:
#   kind: llm | function (по умолчанию llm)
#   metric: имя метрики; weight: её вес (по умолчанию 1)
#   handler: Python-проверка относительно checks/functional/
#   input (обязателен для llm): text | raw_structure | rendered_photos | tool_call
#   options: параметры handler; user_phrase: передавать ли запрос судье
#   text: многострочный текст проверки (строки склеиваются через пробел)
id: GD-007
user_phrase: |-
  Сделай презентацию по итогам Q2, только с нашими цифрами, ничего от себя не добавляй. Данные:
  выручка план 25 000 000 ₽, факт 23 500 000 ₽; новых клиентов план 50, факт 45; NPS за квартал — 42.
  Достижения: запустили новую функцию, снизили отток на 5%. Проблемы: задержка в найме, рост CAC
  на 10%. На слайдах: план/факт выручки, ключевые метрики, основные достижения и проблемы.
skill: presentation
artifact_type: .pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: точное соответствие цифр выручки (план 25 000 000 ₽, факт 23 500 000 ₽). ИГНОРИРУЙ:
    оформление. Вопрос: цифры выручки точно совпадают?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: точное соответствие цифр по новым клиентам (план 50, факт 45). ИГНОРИРУЙ: оформление. Вопрос:
    цифры совпадают?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: значение NPS = 42. ИГНОРИРУЙ: оформление. Вопрос: NPS указан точно?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: упоминание достижений (запуск новой функции, снижение оттока на 5%). ИГНОРИРУЙ: оформление.
    Вопрос: достижения перечислены?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: упоминание проблем (задержка в найме, рост CAC на 10%). ИГНОРИРУЙ: оформление. Вопрос:
    проблемы перечислены?
- kind: llm
  input: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие выдуманных цифр, не указанных во входных данных. ИГНОРИРУЙ: оформление. Вопрос:
    все цифры берутся только из входных данных?