# Тест-кейс GD-026. Пользователь сначала проработал рассказ с одной LLM,
# а потом вставляет её ответ (готовую структуру презентации) в ту, которая
# умеет создавать pptx. Промт естественно многострочный, как вставка текста.
# metric_groups — группы из metrics/presentations/<группа>.yaml.
# checks — индивидуальные проверки кейса:
#   kind: llm | function (по умолчанию llm)
#   metric: имя метрики; weight: её вес (по умолчанию 1)
#   handler: Python-проверка относительно checks/functional/
#   input (обязателен для llm): text | raw_structure | rendered_photos | tool_call
#   options: параметры handler; user_phrase: передавать ли запрос судье
#   text: многострочный текст проверки (строки склеиваются через пробел)
id: GD-026
user_phrase: |-
  Создай pptx слайды
  Конечно, помогу подготовить структуру и содержание презентации по продукту «СберКот». Поскольку вы не приложили файл с материалами, я подготовлю универсальный каркас презентации, который вы сможете наполнить конкретными данными о вашем продукте (цифрами, скриншотами, кейсами).
  Ниже — структура из 10 слайдов с текстовым наполнением и рекомендациями по оформлению.
  Слайд 1. Титульный лист
  Заголовок: ИИ-помощник сотрудника «СберКот»
  Подзаголовок: Ваш цифровой ассистент для ежедневных рабочих задач
  Визуал: Логотип продукта, фирменный стиль Сбера.
  Слайд 2. Проблема и боль сотрудника
  Заголовок: Сотрудники тратят время на рутину
  Ключевые тезисы:
  До 30–40% рабочего времени уходит на поиск информации, подготовку документов и рутинные операции.
  Разрозненные системы и базы знаний замедляют работу.
  Высокая когнитивная нагрузка при переходе между задачами.
  Визуал: Инфографика с цифрами потерь времени или схема «хаоса» из множества окон и вкладок.
  Слайд 3. Решение — СберКот
  Заголовок: СберКот — единая точка входа для всех рабочих задач
  Тезисы:
  Корпоративный ИИ-ассистент, встроенный в рабочий контур Сбера.
  Понимает естественный язык и контекст задач.
  Работает с документами, данными и текстами без переключения между системами.
  Визуал: Крупный скриншот интерфейса или схема интеграции.
  Слайд 4. Ключевые возможности (Блок 1)
  Заголовок: Работа с документами и текстами
  Возможности (списком или карточками):
  Саммари: краткое изложение длинных документов и отчётов.
  Анализ: извлечение ключевых данных, сравнение файлов, ответы на вопросы по содержанию.
  Редактирование: подготовка писем, приказов, презентаций и других материалов.
  Перевод: оперативный перевод рабочих текстов.
  Слайд 5. Ключевые возможности (Блок 2)
  Заголовок: Аналитика и подготовка к встречам
  Возможности:
  Структурирование: превращение «сырых» данных в понятные таблицы и выжимки.
  Мозговой штурм: генерация идей и альтернативных решений.
  Подготовка: формирование повесток, вопросов к переговорам и кратких справок.
  Слайд 6. Преимущества для бизнеса
  Заголовок: Эффективность и скорость
  Тезисы (с цифрами, если есть):
  Экономия времени: сокращение времени на рутинные операции до 30–50%.
  Скорость: получение ответа за секунды, а не часы.
  Качество: снижение числа ошибок в документах за счет автоматизации.
  Масштабируемость: помощь каждому сотруднику без увеличения нагрузки на поддержку.
  Слайд 7. Безопасность и доверие
  Заголовок: Корпоративная безопасность — приоритет
  Тезисы:
  Работает внутри защищённого контура Сбера.
  Данные не покидают корпоративную среду.
  Соблюдение политик информационной безопасности и конфиденциальности.
  Визуал: Иконки замка, щита, знак соответствия стандартам.
  Слайд 8. Как это работает (Сценарий использования)
  Заголовок: Пример рабочего дня с СберКотом
  Сценарий (пошагово):
  Утро: СберКот собирает саммари входящих документов и отчётов за ночь.
  Задача: Сотрудник просит подготовить проект ответа контрагенту — ассистент делает черновик.
  Встреча: СберКот формирует краткую справку по участникам и повестке.
  Вечер: Ассистент структурирует итоги дня в отчёт.
  Слайд 9. Внедрение и поддержка
  Заголовок: Быстрый старт и развитие
  Тезисы:
  Простая интеграция с существующими корпоративными системами.
  Обучение сотрудников и методические материалы.
  Постоянное развитие модели и добавление новых навыков.
  Слайд 10. Заключение / Призыв к действию
  Заголовок: СберКот — ваш надёжный цифровой коллега
  Финальный посыл:
  Сфокусируйтесь на важных задачах, рутину доверьте ИИ.
  Начните использовать СберКот уже сегодня.
  Контакты / QR-код: Ссылка на внутренний портал или контакты команды продукта.
skill: presentation
artifact_type: .pptx
metric_groups:
  - sanity
  - readability
  - layout
  - style
  - beauty
  - text
  - content_language
checks:
- kind: function
  metric: Следование инструкции
  user_phrase: false
  handler: pptx/raw_structure/slide_count
  options:
    condition: 10
  text: |-
    slide_count 10
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: соответствие структуры колоды заготовке из USER_INSTRUCTION (10 разделов: титульный
    лист; проблема и боль сотрудника; решение; ключевые возможности — блок 1; ключевые возможности — блок 2;
    преимущества для бизнеса; безопасность и доверие; как это работает / сценарий; внедрение и поддержка;
    заключение с призывом к действию). ИГНОРИРУЙ: оформление, точные формулировки заголовков, орфографию.
    Вопрос: все 10 разделов присутствуют в этом порядке и лишних смысловых разделов нет?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: название продукта. ИГНОРИРУЙ: оформление, остальной текст. Вопрос: продукт везде назван
    «СберКот» (или «ИИ-помощник сотрудника»), других названий продукта колода не вводит?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: количественные данные. ИГНОРИРУЙ: слайды без цифр, оформление. Вопрос: все цифры на
    слайдах взяты из заготовки (до 30–40% рабочего времени на рутину, до 30–50% экономии времени, 24/7,
    ответ за секунды / за 2 секунды) и новых выдуманных цифр нет?
- kind: llm
  input: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наполнение слайдов относительно заготовленных тезисов. ИГНОРИРУЙ: оформление, стиль
    формулировок. Вопрос: содержание соответствует заготовке (саммари, анализ, редактирование, перевод;
    структурирование, мозговой штурм, подготовка к встречам; данные не покидают контур Сбера; сценарий
    рабочего дня; интеграция, обучение, развитие модели; призыв начать использовать) и не выдумывает новые
    функции продукта?