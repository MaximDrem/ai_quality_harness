# Тест-кейс GD-010.
# checks — только индивидуальные проверки кейса. Формат проверки:
#   kind: text | vlm | functional (по умолчанию text)
#   metric: имя метрики (необязательно)
#   user_phrase: true/false — передавать ли user_phrase кейса судье (по умолчанию true)
#   text: многострочный текст проверки (строки склеиваются через пробел)
# Общие проверки по типу файла берутся из example/checks/common/<тип>.yaml.
id: GD-010
user_phrase: |-
  Нужен one-pager по нашему продукту — всё на одном слайде: проблема, решение, ключевые преимущества
  и призыв к действию. Названия у продукта пока нет, ставь плейсхолдер «Продукт X». Текста по
  минимуму — это же одна страница.
skill: presentation
artifact_type: .pptx
checks:
- kind: functional
  metric: Следование инструкции
  user_phrase: false
  text: |-
    slide_count 1
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: наличие всех 4 блоков (проблема, решение, преимущества, CTA). ИГНОРИРУЙ: оформление. Вопрос:
    все 4 блока присутствуют?
- kind: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: объём текста. ИГНОРИРУЙ: заголовки блоков. Вопрос: основной текст ≤ 80 слов?
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: количество буллетов в каждом блоке. ИГНОРИРУЙ: содержание. Вопрос: ≤5 буллетов на блок?
- kind: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: использование плейсхолдера «Продукт X». ИГНОРИРУЙ: остальной текст. Вопрос: плейсхолдер
    использован?
- kind: vlm
  metric: Компоновка
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: визуальную сбалансированность единственного слайда. ИГНОРИРУЙ: шрифт, цвета. Вопрос: слайд не
    перегружен, все 4 блока различимы?