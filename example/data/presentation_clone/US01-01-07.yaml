id: US01-01-07
user_phrase: |-
  Сделай презентацию на 8 слайдов по приложенному шаблону. Тема — «Работа с ИИ в банке». Это вводная презентация для сотрудников, которые никогда не пользовались нашими ИИ-инструментами. Конечно! Вот структура презентации:

  **Слайд 1. Титульный**
  Заголовок: «Работа с ИИ в банке»
  Подзаголовок: «Инструменты, правила и первые шаги»

  **Слайд 2. Зачем банку ИИ**
  Тезисы:
  - Экономит время на рутинных задачах
  - Помогает быстрее находить информацию
  - Подсказывает варианты ответов клиентам

  **Слайд 3. Наши инструменты**
  Таблица: инструмент, для чего, ограничения.
  - GigaChat: подготовка текстов и писем; нельзя вводить персональные данные клиентов
  - Knowledge Assistant: поиск по внутренней базе знаний; только рабочие вопросы
  - Code Helper: помощь разработчикам; не передавать код с секретами

  **Слайд 4. Что можно поручить GigaChat**
  Примеры задач: черновик письма клиенту, саммари длинного документа, идеи для названия продукта.

  **Слайд 5. Правила безопасности**
  - Не вводим персональные данные клиентов
  - Не вводим коды, пароли, номера карт
  - Проверяем факты перед отправкой клиенту

  **Слайд 6. Как получить доступ**
  Шаги:
  1. Откройте внутренний портал «Мой ИИ»
  2. Выберите нужный инструмент
  3. Пройдите короткий курс (20 минут)
  4. Можно работать

  **Слайд 7. Частые вопросы**
  - Можно ли использовать личный ChatGPT для рабочих задач? — Нет.
  - Что делать, если ИИ ошибся? — Проверить по базе знаний и сообщить руководителю.
  - Сохраняется ли история? — Да, 30 дней.

  **Слайд 8. Заключение**
  Заголовок: «Начните с малого»
  Призыв: попробуйте GigaChat на одной задаче уже сегодня.
skill: presentation
metric_groups:
  - presentations/sanity
  - presentations/readability
  - presentations/layout
  - presentations/style
  - presentations/beauty
  - presentations/text
  - presentations/content_language
  - presentation_clone/template_selection
  - presentation_clone/template_fidelity
attachments:
  - name: template
    path: assets/Северный_ветер.pptx
artifacts:
  - name: style_reference
    type: .md
    path: STYLE.md
  - name: presentation
    is_final_result: true
    type: .pptx
checks:
  - kind: function
    metric: Следование инструкции
    user_phrase: false
    handler: pptx/raw_structure/slide_count
    options:
      condition: 8
    text: slide_count 8
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: последовательность из 8 слайдов: титульный, зачем банку ИИ, наши инструменты, задачи GigaChat, правила безопасности, получение доступа, частые вопросы, заключение. ИГНОРИРУЙ: оформление. Вопрос: структура и порядок полностью соблюдены, лишних разделов нет?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: титульный слайд. ИГНОРИРУЙ: оформление. Вопрос: присутствуют заголовок «Работа с ИИ в банке» и подзаголовок «Инструменты, правила и первые шаги»?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: второй слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: указаны все три заданные причины: экономия времени на рутине, быстрый поиск информации и подсказки вариантов ответов клиентам?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: третий слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: таблица содержит GigaChat для текстов и писем с запретом персональных данных, Knowledge Assistant для внутренней базы знаний только по рабочим вопросам и Code Helper для разработчиков с запретом передачи секретов?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: четвёртый слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: приведены все три примера задач GigaChat: черновик письма клиенту, саммари длинного документа и идеи названия продукта?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: пятый слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: указаны запреты на персональные данные, коды/пароли/номера карт и требование проверять факты перед отправкой клиенту?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: шестой слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: перечислены четыре шага: открыть портал «Мой ИИ», выбрать инструмент, пройти курс на 20 минут и начать работу?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: седьмой слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: FAQ содержит запрет личного ChatGPT для рабочих задач, действие при ошибке ИИ через базу знаний и руководителя, а также срок хранения истории 30 дней?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: восьмой слайд. ИГНОРИРУЙ: оформление и другие слайды. Вопрос: есть заголовок «Начните с малого» и призыв попробовать GigaChat на одной задаче уже сегодня?
  - kind: llm
    input: text
    metric: Контент и язык
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: доступность вводной презентации для сотрудников без опыта работы с ИИ. ИГНОРИРУЙ: заданные названия инструментов и оформление. Вопрос: текст написан на понятном русском языке, без неопределённых технических терминов и канцелярита?
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_slide_text
    artifacts: [presentation]
    options:
      terms:
        - Название презентации
        - 'Подзаголовок: о чём эта презентация'
        - Имя Фамилия
        - Москва, 2026
        - Название первого раздела
        - Название второго раздела
        - Название третьего раздела
        - Название раздела
        - Коротко опишите, о чём этот раздел
        - Заголовок слайда с текстом
        - Основная мысль слайда
        - Пример текста второго уровня
        - 'Второй пункт: не больше двух строк'
        - Третий пункт с коротким пояснением
        - Заголовок рядом с изображением
        - Опишите, что показано на изображении
        - Добавьте два-три поясняющих пункта
        - Каждый пункт — одна мысль
        - Изображение замените своим
        - Первое направление
        - Второе направление
        - Третье направление
        - Короткое описание направления
        - Заголовок первого блока
        - Заголовок второго блока
        - Первый пункт блока
        - Второй пункт блока
        - Преимущества варианта А
        - Недостатки варианта А
        - Преимущества варианта Б
        - Недостатки варианта Б
        - Пояснение к цифре
        - Пример таблицы
        - Удалите этот слайд перед показом презентации
        - Выручка, млн ₽
        - Клиенты, тыс.
        - Средний чек, ₽
        - Что будет сделано на этом этапе
        - Пример диаграммы
        - Рост показателя А по кварталам
        - Показатель А
        - Показатель Б
        - 'Источник: данные компании'
        - Заголовок к большому изображению
        - Подпись к изображению, при необходимости — источник
        - name@severveter.ru
        - +7 000 000-00-00
        - 'Тезисы:'
        - 'Таблица:'
        - 'Шаги:'
      patterns:
        - '(?i)Конечно!\s*Вот структура презентации'
        - '(?i)\bСлайд\s+\d+\s*[.:]'
        - '(?i)(?<!\d)85%|3x|\+29%|(?<!\d)120(?!\d)'
        - '(?i)\b(?:2024|2025|2026)\b'
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_metadata
    artifacts: [presentation]
    options:
      terms:
        - 'Шаблон «Северный ветер»'
        - generated using python-pptx
        - Steve Canny
        - Имя Фамилия
        - name@severveter.ru
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_links
    artifacts: [presentation]
    options:
      terms: [severveter.ru]
