id: US01-01-02
user_phrase: |-
  Сделай презентацию на 5 слайдов по приложенному шаблону для операционистов: у нас появился ИИ-помощник, который подсказывает ответы клиентам.
  Объясни простым языком, что это, чем поможет и как начать пользоваться. Без технических терминов. Финальный слайд — призыв
  попробовать на этой неделе.
skill: presentation
metric_groups:
  - presentations/sanity
  - presentations/readability
  - presentations/layout
  - presentations/style
  - presentations/beauty
  - presentations/text
  - presentations/content_language
  - presentation_clone/template_selection
  - presentation_clone/template_fidelity
attachments:
  - name: template
    path: assets/AI_Technology_Slidesgo_onestyle.pptx
artifacts:
  - name: style_reference
    type: .md
    path: STYLE.md
  - name: presentation
    is_final_result: true
    type: .pptx
checks:
  - kind: function
    metric: Следование инструкции
    user_phrase: false
    handler: pptx/raw_structure/slide_count
    options:
      condition: 5
    text: slide_count 5
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: аудиторию и назначение помощника. ИГНОРИРУЙ: оформление. Вопрос: презентация адресована операционистам и объясняет, что ИИ-помощник подсказывает им ответы клиентам?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: наличие трёх смысловых блоков: что это за помощник, чем он поможет и как начать пользоваться. ИГНОРИРУЙ: оформление. Вопрос: все три блока присутствуют?
  - kind: llm
    input: text
    metric: Следование инструкции
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: финальный призыв к действию. ИГНОРИРУЙ: остальные слайды и оформление. Вопрос: последний слайд призывает попробовать помощника именно на этой неделе?
  - kind: llm
    input: text
    metric: Контент и язык
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: простоту изложения для операционистов. ИГНОРИРУЙ: дизайн. Вопрос: текст написан простым и понятным русским языком?
  - kind: llm
    input: text
    metric: Контент и язык
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: отсутствие технических терминов. ИГНОРИРУЙ: название ИИ-помощника и оформление. Вопрос: в тексте нет специальных технических терминов, требующих объяснения?
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_slide_text
    artifacts: [presentation]
    options:
      terms:
        - Slidesgo
        - CREDITS
        - Instructions for use
        - CONTENTS OF THIS TEMPLATE
        - Here is where your presentation begins
        - You can describe the topic of the section here
        - ARTIFICIAL INTELLIGENCE (AI)
        - PROJECT PROPOSAL
        - TABLE OF CONTENTS
        - OUR COMPANY
        - WHAT ARE WE WORKING ON?
        - AWESOME WORDS
        - SOMEONE FAMOUS
        - OUR ASPIRATIONS
        - MAYOR REQUIREMENTS
        - PREDICTED RESULTS
        - AI IN A NUTSHELL
        - DESKTOP MOCKUP
        - SNEAK PEEK
        - OUR PARTNERS
        - OUR LOCATION
        - OUR TEAM
        - Jenna Doe
        - Juliana Silva
        - Neil Tran
        - Josep Garcia
        - Lana Petrov
        - Andrea Smith
        - Samira Hadid
        - John James
        - Jenna Smith
        - Please keep this slide for attribution
        - ALTERNATIVE RESOURCES
        - RESOURCES
        - Did you like the resources on this template
        - assortment of alternative resources
        - You can replace the image on the screen
        - Insert your multimedia content
        - This is a quote
        - You can enter a subtitle
        - YOUR LOGO
        - ICON PACK
      patterns:
        - '(?i)\b(?:Mercury|Venus|Mars|Jupiter|Saturn|Neptune)\b'
        - '(?i)\bHere you could\b'
        - '(?i)\bFor more info about\b'
        - '(?i)\bYou can talk about\b'
        - '(?i)\bYou can give a brief description\b'
        - '(?i)\bYou can list your (?:objectives|company values)\b'
        - '(?i)5,000,000|9h 55m 23\s*s|333,000|386,000\s*km|\$10,000,000|\$30,000|\b20XX\b'
        - '(?i)yourwebsite\.com|youremail@freepik\.com|\+91 620 421 838'
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_metadata
    artifacts: [presentation]
    options:
      terms: [Slidesgo, Freepik, Flaticon, Storyset, Wepik, Videvo, CREDITS, yourwebsite.com, youremail@freepik.com]
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_links
    artifacts: [presentation]
    options:
      terms: [slidesgo.com, freepik.com, flaticon.com, storyset.com, wepik.com, videvo.net, bit.ly, docs.google.com]
