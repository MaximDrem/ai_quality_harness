id: US01-01-01
user_phrase: |-
  Сделай презентацию для сотрудников на 7 слайдов по приложенному шаблону. Тема — безопасная работа на удалёнке.
skill: presentation
metric_groups:
  - presentations/sanity
  - presentations/readability
  - presentations/layout
  - presentations/style
  - presentations/beauty
  - presentations/text
  - presentations/content_language
  - presentation_clone/template_selection
  - presentation_clone/template_fidelity
attachments:
  - name: template
    path: assets/AI_Technology_Slidesgo_onestyle.pptx
artifacts:
  - name: style_reference
    type: .md
    path: STYLE.md
  - name: presentation
    is_final_result: true
    type: .pptx
checks:
  - kind: function
    metric: Следование инструкции
    user_phrase: false
    handler: pptx/raw_structure/slide_count
    options:
      condition: 7
    text: slide_count 7
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: соответствие содержания теме безопасной работы на удалёнке. ИГНОРИРУЙ: оформление. Вопрос: презентация посвящена именно безопасности при удалённой работе, а не общим преимуществам удалёнки?
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: адресацию презентации сотрудникам согласно USER_INSTRUCTION. ИГНОРИРУЙ: оформление. Вопрос: содержание рассчитано на рядовых сотрудников, а не на специалистов по информационной безопасности или руководство?
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: практическую пользу для сотрудников. ИГНОРИРУЙ: оформление. Вопрос: даны конкретные правила и действия для безопасной удалённой работы, а не только общие рассуждения о рисках?
  - kind: llm
    input: text
    metric: Контент и язык
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: язык внутренней инструкции для сотрудников. ИГНОРИРУЙ: дизайн. Вопрос: текст написан на понятном русском языке, имеет инструктивный характер и не перегружен сложной терминологией?
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_slide_text
    artifacts: [presentation]
    options:
      terms:
        - Slidesgo
        - CREDITS
        - Instructions for use
        - CONTENTS OF THIS TEMPLATE
        - Here is where your presentation begins
        - You can describe the topic of the section here
        - ARTIFICIAL INTELLIGENCE (AI)
        - PROJECT PROPOSAL
        - TABLE OF CONTENTS
        - OUR COMPANY
        - WHAT ARE WE WORKING ON?
        - AWESOME WORDS
        - SOMEONE FAMOUS
        - OUR ASPIRATIONS
        - MAYOR REQUIREMENTS
        - PREDICTED RESULTS
        - AI IN A NUTSHELL
        - DESKTOP MOCKUP
        - SNEAK PEEK
        - OUR PARTNERS
        - OUR LOCATION
        - OUR TEAM
        - Jenna Doe
        - Juliana Silva
        - Neil Tran
        - Josep Garcia
        - Lana Petrov
        - Andrea Smith
        - Samira Hadid
        - John James
        - Jenna Smith
        - Please keep this slide for attribution
        - ALTERNATIVE RESOURCES
        - RESOURCES
        - Did you like the resources on this template
        - assortment of alternative resources
        - You can replace the image on the screen
        - Insert your multimedia content
        - This is a quote
        - You can enter a subtitle
        - YOUR LOGO
        - ICON PACK
      patterns:
        - '(?i)\b(?:Mercury|Venus|Mars|Jupiter|Saturn|Neptune)\b'
        - '(?i)\bHere you could\b'
        - '(?i)\bFor more info about\b'
        - '(?i)\bYou can talk about\b'
        - '(?i)\bYou can give a brief description\b'
        - '(?i)\bYou can list your (?:objectives|company values)\b'
        - '(?i)5,000,000|9h 55m 23\s*s|333,000|386,000\s*km|\$10,000,000|\$30,000|\b20XX\b'
        - '(?i)yourwebsite\.com|youremail@freepik\.com|\+91 620 421 838'
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_metadata
    artifacts: [presentation]
    options:
      terms: [Slidesgo, Freepik, Flaticon, Storyset, Wepik, Videvo, CREDITS, yourwebsite.com, youremail@freepik.com]
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_links
    artifacts: [presentation]
    options:
      terms: [slidesgo.com, freepik.com, flaticon.com, storyset.com, wepik.com, videvo.net, bit.ly, docs.google.com]
