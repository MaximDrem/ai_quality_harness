id: US01-01-06
user_phrase: |-
  Сделай презентацию-памятку на 6 слайдов по приложенному шаблону. Тема — работа с данными клиентов: что разрешено, что запрещено, три
  самые частые ошибки и что делать, если данные всё же утекли. Аудитория — операционисты, без юридических формулировок.
skill: presentation
metric_groups:
  - presentations/sanity
  - presentations/readability
  - presentations/layout
  - presentations/style
  - presentations/beauty
  - presentations/text
  - presentations/content_language
  - presentation_clone/template_selection
  - presentation_clone/template_fidelity
attachments:
  - name: template
    path: assets/Remote_Working_Slidesgo_onestyle.pptx
artifacts:
  - name: style_reference
    type: .md
    path: STYLE.md
  - name: presentation
    is_final_result: true
    type: .pptx
checks:
  - kind: function
    metric: Следование инструкции
    user_phrase: false
    handler: pptx/raw_structure/slide_count
    options:
      condition: 6
    text: slide_count 6
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: правила работы с данными клиентов из USER_INSTRUCTION. ИГНОРИРУЙ: ошибки, действия при утечке и оформление. Вопрос: отдельно и конкретно объяснено, что разрешено и что запрещено?
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: блок частых ошибок. ИГНОРИРУЙ: остальные слайды и оформление. Вопрос: перечислены ровно три самые частые ошибки, каждая сформулирована отдельно?
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: действия при утечке данных согласно USER_INSTRUCTION. ИГНОРИРУЙ: остальные слайды и оформление. Вопрос: памятка объясняет, что операционист должен делать, если данные клиентов всё же утекли?
  - kind: llm
    input: text
    metric: Следование инструкции
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: практическую адресацию операционистам. ИГНОРИРУЙ: дизайн. Вопрос: памятка содержит конкретные действия и правила, применимые операционистами в повседневной работе?
  - kind: llm
    input: text
    metric: Контент и язык
    user_phrase: false
    text: |-
      ОЦЕНИВАЙ ТОЛЬКО: язык памятки. ИГНОРИРУЙ: необходимые простые обозначения данных и оформление. Вопрос: текст написан на понятном русском языке без юридических формулировок и канцелярских конструкций?
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_slide_text
    artifacts: [presentation]
    options:
      terms:
        - Slidesgo
        - CREDITS
        - Instructions for use
        - CONTENTS OF THIS TEMPLATE
        - Here is where your presentation begins
        - You can describe the topic of the section here
        - Remote Working
        - Who A
        - Who B
        - Who C
        - AWESOME WORDS
        - SOMEONE FAMOUS
        - PROJECT INTRODUCTION
        - MAJOR REQUIREMENT
        - MAJOR FUNDING
        - THE CONCLUSION
        - THE BIBLIOGRAPHY
        - DESKTOP MOCKUP
        - TABLET MOCKUP
        - MOBILE MOCKUP
        - SNEAK PEEK
        - Jenna Doe
        - Juliana Silva
        - Neil Tran
        - Josep Garcia
        - Lana Petrov
        - Andrea Smith
        - Samira Hadid
        - John James
        - Jenna Smith
        - Please keep this slide for attribution
        - You can replace the image on the screen
        - Insert your multimedia content
        - This is a quote
        - You can enter a subtitle
        - YOUR LOGO
      patterns:
        - '(?i)\b(?:Mercury|Venus|Mars|Jupiter|Saturn|Neptune)\b'
        - '(?i)\bHere you could\b'
        - '(?i)\bFor more info about\b'
        - '(?i)\bYou can describe\b'
        - '(?i)\bYou can give a brief description\b'
        - '(?i)5,000,000|9h 55m 23\s*s|333,000|386,000\s*km|\$300M|\$600M|\$100M|\b20XX\b'
        - '(?i)yourwebsite\.com|youremail@freepik\.com|\+91 620 421 838'
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_metadata
    artifacts: [presentation]
    options:
      terms: [Slidesgo, Freepik, CREDITS, yourwebsite.com, youremail@freepik.com]
  - kind: function
    metric: M5. Чистота от шаблона
    user_phrase: false
    handler: pptx/raw_structure/forbidden_links
    artifacts: [presentation]
    options:
      terms: [slidesgo.com, freepik.com, bit.ly, docs.google.com]
