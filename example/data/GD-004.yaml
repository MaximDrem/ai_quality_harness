# Тест-кейс GD-004.
# checks — только индивидуальные проверки кейса. Формат проверки:
#   kind: text | vlm | functional (по умолчанию text)
#   metric: имя метрики (необязательно)
#   user_phrase: true/false — передавать ли user_phrase кейса судье (по умолчанию true)
#   text: многострочный текст проверки (строки склеиваются через пробел)
# Общие проверки по типу файла берутся из example/checks/common/<тип>.yaml.
id: GD-004
user_phrase: |-
  Делаем питч для инвесторов — коротко, на 5 слайдов и строго в таком порядке: проблема, решение,
  рынок, бизнес-модель, ask. У продукта пока нет названия, пиши просто «Продукт X» и ничего не
  выдумывай. Точных данных по рынку у нас тоже нет, цифры бери ориентировочные и помечай как оценку.
skill: presentation
artifact_type: .pptx
checks:
- kind: functional
  metric: Следование инструкции
  user_phrase: false
  text: |-
    slide_count 5
- kind: text
  metric: Следование инструкции
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: порядок разделов (проблема → решение → рынок → бизнес-модель → ask). ИГНОРИРУЙ: оформление.
    Вопрос: структура и порядок соблюдены?
- kind: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: один смысловой блок на слайд. ИГНОРИРУЙ: оформление. Вопрос: каждый слайд посвящён только
    одной теме?
- kind: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: отсутствие выдуманных точных цифр рынка без пометки «оценка». ИГНОРИРУЙ: оформление. Вопрос:
    рыночные данные помечены как оценочные?
- kind: text
  metric: Следование инструкции
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: использование плейсхолдера «Продукт X» вместо конкретного названия. ИГНОРИРУЙ: остальной
    текст. Вопрос: плейсхолдер использован?
- kind: text
  metric: Контент и язык
  user_phrase: false
  text: |-
    ОЦЕНИВАЙ ТОЛЬКО: деловой стиль для инвесторской аудитории. ИГНОРИРУЙ: вёрстку. Вопрос: тон соответствует питчу
    для инвесторов?