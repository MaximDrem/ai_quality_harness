# Формат и правила соответствуют OpenSpec CLI 1.6.0.
schema: spec-driven

context: |
  Проект: lib-ai-quality-harness.
  Технологии: Python 3.12, YAML, headless OpenCode, XLSX-отчёты, LLM-judge.
  Практическое руководство по кейсам и проверкам: ADD_TEST_CASES.md.
  Спецификации и сопроводительная документация пишутся на русском языке.
  Не использовать в спецификациях и примерах имена потенциальных будущих скилов.
  Проверки по умолчанию выполняются offline, без запуска OpenCode и VLLM.

rules:
  specs:
    - Описывать наблюдаемое поведение и проверяемые контракты, а не детали реализации.
    - Каждое требование содержит хотя бы один сценарий с заголовком ровно `#### Scenario:`.
    - Использовать нормативное SHALL и русские формулировки поведения.
    - Не включать имена потенциальных будущих скилов; использовать нейтральные имена только при необходимости.
    - Известные нереализованные возможности не выдавать за текущие требования; фиксировать их как ограничения или будущие изменения.
  design:
    - Сохранять независимое добавление сценариев, метрик, обработчиков и процессоров без правок основного pipeline.
    - Отделять декларативный контракт YAML от Python-реализации.
    - Учитывать вложения, промежуточные версии, несколько финальных артефактов и источники из uploads.
  tasks:
    - Включать offline-проверку через unittest и проверку OpenSpec CLI 1.6.0.
    - Не включать обязательный запуск OpenCode или VLLM при отсутствии внешних зависимостей.
